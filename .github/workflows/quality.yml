name: quality

# Runs once a pull request is ready: when it opens as ready, or when a draft is marked ready. Later
# pushes start it again only while the pull request has the "ci on every push" label, and adding that
# label starts it at once. Draft pull requests never run it. Every push to main, which includes each
# merged pull request, runs it again so main itself stays checked.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]
    paths-ignore: ["**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

# Each kind of event gets its own group. Most events start a run that skips every job, such as an
# unlabeled push, and that run must not cancel a real one started by another kind of event. Runs on
# main never cancel each other, so every merge gets its own result.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Decides which jobs this change needs; see otus-core's .github/actions/quality-changes.
  # A run the ready gate stops sets no outputs, so every later job skips.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.files.outputs.build }}
      ios: ${{ steps.files.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/otus-core
          path: otus-core
          fetch-depth: 0
          persist-credentials: false
      # Core's branch with this branch's name when there is one, else main, so every Core action
      # and the build come from the Core that lands with this change.
      - name: Use the Core partner branch
        working-directory: otus-core
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --quiet --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      - id: gate
        uses: ./otus-core/.github/actions/ready-gate
      - id: files
        if: steps.gate.outputs.ready == 'true'
        uses: ./otus-core/.github/actions/quality-changes

  # Each job runs one part of checkAll, so the parts run at the same time.
  check:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: check (${{ matrix.part }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: tooling
            tasks: checkTooling
          - part: android build
            tasks: checkAndroidBuild
    # Calendar and otus-core sit side by side, as on a development machine, so Gradle finds Core at
    # ../otus-core and Spotless never sees Core's files.
    defaults:
      run:
        working-directory: otus-calendar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: otus-calendar
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/otus-core
          path: otus-core
          fetch-depth: 0
          persist-credentials: false
      # Core's branch with this branch's name when there is one, else main, so every Core action
      # and the build come from the Core that lands with this change.
      - name: Use the Core partner branch
        working-directory: otus-core
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --quiet --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      - uses: ./otus-core/.github/actions/setup-build
        with:
          directory: otus-calendar
      - run: ./gradlew ${{ matrix.tasks }} --console=plain

  # Runs only while the repository variable IOS_CI is "on" (Settings > Secrets and variables >
  # Actions > Variables), so macOS minutes stay off until someone turns it back on.
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true' && vars.IOS_CI == 'on'
    runs-on: macos-15
    defaults:
      run:
        working-directory: otus-calendar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: otus-calendar
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/otus-core
          path: otus-core
          fetch-depth: 0
          persist-credentials: false
      # Core's branch with this branch's name when there is one, else main, so every Core action
      # and the build come from the Core that lands with this change.
      - name: Use the Core partner branch
        working-directory: otus-core
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --quiet --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      # Compose Multiplatform links iOS 26 SDK symbols, so the app needs Xcode 26.
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - uses: ./otus-core/.github/actions/setup-build
        with:
          directory: otus-calendar
          android: "false"
          python: "false"
      - run: brew install mint
      - run: mint bootstrap
      - run: mint run swiftformat --lint iosApp
      - run: mint run swiftlint lint --strict
      # Xcode's Kotlin build phase downloads Gradle with a 10 second timeout, so fetch it first.
      - run: ./gradlew --version
      - name: Compile iOS simulator app
        run: >-
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk
          iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
          build
